<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab 5 - D3.js Treemap</title><script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script><style>body{font-family:Arial,sans-serif;margin:24px;background:#f5f6f8;color:#222}svg{background:white;border:1px solid #ccc}p{color:#555}</style></head><body><h1>Lab 5: Interactive Treemap</h1><p>Pipeline data volume across Input Sources, Processing, and Output categories. Hover over a tile for its exact value.</p><div id="treemap"></div><script>
const width=1000,height=600,data={name:'Data Pipeline',children:[{name:'Input Sources',children:[{name:'Web Logs',value:5000},{name:'Mobile App',value:3000},{name:'CRM Export',value:2000}]},{name:'Processing',children:[{name:'Data Cleaning',value:10000},{name:'EDA',value:8500},{name:'Feature Engineering',value:7200},{name:'Model Training',value:4800},{name:'Evaluation',value:6000}]},{name:'Output',children:[{name:'Visualization',value:3500},{name:'Deployment',value:5000}]}]};
const root=d3.hierarchy(data).sum(d=>d.value||0).sort((a,b)=>b.value-a.value);d3.treemap().size([width,height]).paddingInner(3).paddingOuter(5).round(true)(root);
const svg=d3.select('#treemap').append('svg').attr('width',width).attr('height',height);const color=d3.scaleOrdinal().domain(['Input Sources','Processing','Output']).range(['#4C78A8','#F58518','#54A24B']);
const cells=svg.append('g').selectAll('g').data(root.leaves()).join('g').attr('transform',d=>`translate(${d.x0},${d.y0})`);
cells.append('rect').attr('width',d=>Math.max(0,d.x1-d.x0)).attr('height',d=>Math.max(0,d.y1-d.y0)).attr('fill',d=>color(d.parent.data.name)).attr('fill-opacity',.84).attr('stroke','#fff').on('mouseover',function(){d3.select(this).transition().duration(200).attr('fill-opacity',1)}).on('mouseout',function(){d3.select(this).transition().duration(200).attr('fill-opacity',.84)}).append('title').text(d=>d.data.name+': '+d.value);
cells.append('text').attr('x',6).attr('y',18).text(d=>d.data.name).attr('fill','white').attr('font-size',12);cells.append('text').attr('x',6).attr('y',34).text(d=>d.value.toLocaleString()).attr('fill','white').attr('font-size',11);
</script></body></html>
